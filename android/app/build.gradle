plugins {
    id 'com.android.application'
}

// The signing key and its password are created on the first build by build-apk.sh and never committed.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore/keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'nz.littlekauri.app'
    compileSdk 36

    defaultConfig {
        applicationId 'nz.littlekauri.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/little-kauri.jks')
            storePassword keystoreProps['password']
            keyAlias 'littlekauri'
            keyPassword keystoreProps['password']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
